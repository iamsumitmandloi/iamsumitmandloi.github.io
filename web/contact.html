<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f3140">
  <meta name="description" content="Contact Sumit Mandloi about mobile engineering roles or projects.">
  <title>Contact Sumit Mandloi</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f8f7ff; background: #252735; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 7vw, 80px) 20px; }
    main { max-width: 600px; margin: auto; }
    a { color: #ded6ff; text-underline-offset: 3px; }
    h1 { margin: 14px 0 8px; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.1; }
    p { color: #dddce8; line-height: 1.5; }
    form { margin-top: 24px; padding: clamp(18px, 5vw, 32px); background: #303241; border: 1px solid #515367; border-radius: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 650; }
    input, textarea, button { font: inherit; }
    input, textarea { display: block; width: 100%; padding: 12px; color: #fff; background: #242634; border: 1px solid #828398; border-radius: 8px; margin-bottom: 18px; }
    textarea { resize: vertical; min-height: 130px; }
    button { min-height: 46px; background: #ded6ff; color: #231943; border: 0; border-radius: 8px; padding: 10px 17px; font-weight: 750; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #c6b7ff; outline-offset: 3px; }
    #status { margin: 0; }
    #status:not(:empty) { margin-top: 12px; }
    #status[data-error] { color: #ffcfce; }
  </style>
  <script src="contact.js" defer></script>
</head>
<body>
  <main>
    <a href="./">← Back to portfolio</a>
    <h1>Contact me</h1>
    <p>Have a mobile engineering role or project in mind? Send me a message.</p>
    <form id="contact" action="https://formspree.io/f/mrpqepop" method="post">
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" maxlength="100" required>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="message">Your message</label>
      <textarea id="message" name="message" rows="5" maxlength="3000" required></textarea>
      <input type="text" name="_gotcha" hidden tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" disabled>Send message</button>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript><p>Enable JavaScript to send a message here, or use the email link below.</p></noscript>
    </form>
    <p>Prefer email? <a href="mailto:sumitkumar77.sk@gmail.com">Email me directly</a>.</p>
  </main>
</body>
</html>
